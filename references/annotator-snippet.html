  /* Concept-berichtkaart: een nog niet verstuurd bericht, zo weergegeven dat de reviewer

  /* Geneste subpunten: elk niveau springt een stap verder in en krijgt een haakje
     naar zijn ouder, zodat een lijst met subtaken op het oog te lezen is. Zie
     SKILL.md deel 7. Hangt bewust aan niets anders dan de eigen klasse — geen
     .card of andere pagina-klasse — zodat het op elk blok-element werkt (kaart,
     li, div). De lijnkleur volgt --line als de pagina die definieert, met een
     lichte fallback zodat het haakje ook zonder tokens zichtbaar is. */
  .la-sub, .la-sub2, .la-sub3, .la-sub4 {
    --la-diepte: 1;
    position: relative;
    margin-left: calc(var(--la-diepte) * var(--la-stap, 30px));

<script>
/* Secties in dit IIFE (één paste-blok, geen bundler):
   bridge-poller · locators/anker · render/wezen · popup/refs · save
   regio-snip · tekstselectie · draft/hunks · HtmlAnnotator · sessie-links */
(function () {
  "use strict";
  var BRIDGE = (location.protocol.indexOf("http") === 0 && location.pathname.indexOf("/p/") === 0)
    ? (location.protocol + "//" + location.host)
    : "http://127.0.0.1:8791";
  var KEY = "luc-annotaties:" + location.pathname;
  var anns = [];
  try { anns = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
  var teller = anns.reduce(function (m, a) { return Math.max(m, a.nr || 0); }, 0);
  var brug = { ok: false, jsonPath: null, count: 0, round: null };

  function bewaarLokaal() { try { localStorage.setItem(KEY, JSON.stringify(anns)); } catch (e) {} }
  function el(tag, css, ouder) { var d = document.createElement(tag); if (css) d.style.cssText = css; (ouder || document.body).appendChild(d); return d; }
  function slug() { return (document.title || location.pathname).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "pagina"; }
  function paginaBestand() {
    if (location.protocol === "file:") {
      try { return decodeURIComponent(location.pathname); } catch (e) { return location.pathname; }
    }
    /* via de bridge geserveerd: http://127.0.0.1:8791/p/<pad-vanaf-home> */
    var m = location.pathname.match(/^\/p\/(.+)$/);
    if (m && (location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
      try { return "~/" + decodeURIComponent(m[1]); } catch (e) { return "~/" + m[1]; }
    }
    return null;
  }
  function domHash() {
    var h = 5381, s = document.body ? document.body.innerText || "" : "";
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(16);
  }
  /* eenmalig, vóór de annotator zelf iets in de DOM zet: anders veranderen
     badges en de statuspil de hash en denkt de bridge dat het een nieuwe ronde is */
  var DOMHASH = domHash();
  function basis() {
    return {
      page: location.href, pageFile: paginaBestand(), slug: slug(), title: document.title,
      domHash: DOMHASH,
      doc: { w: document.documentElement.scrollWidth, h: document.documentElement.scrollHeight }
    };
  }

  /* ---- bridge-communicatie -------------------------------------- */
  function post(pad, body) {
    return fetch(BRIDGE + pad, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || "bridge-fout");
      return j;
    });
  }
  function zetStatus(aan, tekst, titel) {
    var s = document.getElementById("la-status");
    if (!s) return;
    s.classList.toggle("la-uit", !aan);
    s.textContent = tekst;
    s.title = titel || "";
  }
  /* De bridge is leidend zodra hij bereikbaar is: hij levert de open (niet-resolved)
     annotaties van de lopende ronde, en die vervangen de lokale lijst. Zo verdwijnen
     verwerkte annotaties na een refresh en blijven de rest gewoon staan. Zonder
     bridge blijft localStorage het vangnet. */
  function uitBridge(j) {
    if (!j || !Array.isArray(j.annotations)) return;
    anns = j.annotations.map(function (a) {
      return {
        id: a.id, nr: a.nr, type: a.type || "region",
        rect: a.rect || null, comment: a.comment || "", target: a.target || "",
        selectedText: a.selectedText || "", locator: a.locator || null, refs: a.refs || null,
        commentExpanded: a.commentExpanded || "", refsIncomplete: a.refsIncomplete || null,
        img: null,
        veld: a.veld || "", origineel: a.origineel || "", nieuw: a.nieuw || "",
        diff: a.diff || [], hunks: a.hunks || [],
        createdAt: a.createdAt, stale: !!a.stale
      };
    });
    teller = Math.max(j.maxNr || 0, anns.reduce(function (m, a) { return Math.max(m, a.nr || 0); }, 0));
    bewaarLokaal(); render();
  }

  function verversSessie() {
    return post("/session", basis()).then(function (j) {
      /* Nieuwe ronde op schijf? Dan horen de badges van de vorige ronde hier niet
         meer thuis: die staan al veilig in hun eigen rondemap. Lokaal opschonen,

  /* ---- regio-selectie (snipping) --------------------------------- */
  var overlay = null, start = null, ghost = null;

      ruimGhostOp();
      if (g) { g.classList.add("la-ghost-vast"); hangendeGhost = g; }
      teller += 1;
      var regio = {
        id: Date.now() + "-" + teller, nr: teller, type: "region", rect: rect,
        target: tekstBij(rect), comment: "", img: null,

  /* Sneltoets ⌘⇧0 (Ctrl+Shift+0): staat er tekst geselecteerd, dan is dat "Annotate selection" op de

  /* ---- tracked changes op conceptberichten ------------------------
     Een comment naast de tekst laat de reviewer uitleggen wat er anders moet; vaak is het
     sneller om het gewoon anders op te schrijven. Daarom is elke .la-draft-txt te
     bewerken, en wordt het verschil met de oorspronkelijke tekst zelf de annotatie:
     voor, na, en de losse wijzigingen. Zo hoeft er niets vertaald te worden van
     bedoeling naar tekst.

     De kaart is rich text: opsommingen, vet, cursief en links worden getoond zoals de
     ontvanger ze straks in de mail ziet. Het toegestane setje is bewust klein en
     mail-veilig (p, ul, ol, li, b, i, a, br) — precies wat Outlook zonder gedoe rendert.

     Het diffen gebeurt NIET op die HTML maar op de platte-tekstprojectie ervan (zie
     docs/DECISIONS.md, 2026-08-28). Tekst en opmaak zijn twee kanalen:
       · tekstwijzigingen  -> hunks zoals altijd (voor/na/verwijderd/toegevoegd),

  function laTokens(s) { return s.match(/\s+|\S+/g) || []; }

  /* === blokmodel ===================================================
     Een concept is een lijst blokken. Een blok is een alinea of één opsommingsregel;
     de tekst erin mag harde regelovergangen (\n) bevatten. Runs dragen de inline-opmaak.
     Alles wat niet in dit model past wordt bij het inlezen platgeslagen tot tekst —
     dat is meteen de sanitizer: er kan niets de kaart in dat niet mail-veilig is. */

  function laVetStijl(el) {
    var w = el.style && el.style.fontWeight;
    if (!w) return false;
    return w === "bold" || w === "bolder" || parseInt(w, 10) >= 600;
  }
  function laCursiefStijl(el) {
    return !!(el.style && el.style.fontStyle === "italic");
  }

  function laRunsVanNode(node, erf, uit) {
    var kinderen = node.childNodes;
    for (var i = 0; i < kinderen.length; i++) {
      var k = kinderen[i];
      if (k.nodeType === 3) {
        if (k.nodeValue) uit.push({ t: k.nodeValue, b: erf.b, i: erf.i, href: erf.href });
        continue;
      }
      if (k.nodeType !== 1) continue;
      var nm = k.nodeName;
      if (nm === "BR") { uit.push({ t: "\n", b: erf.b, i: erf.i, href: erf.href }); continue; }
      /* opmaak van de tracked-change-weergave zelf telt niet mee als inhoud */
      if (nm === "SUP" && k.className === "la-hunk-nr") continue;
      if (nm === "DEL") continue;
      laRunsVanNode(k, {
        b: erf.b || nm === "B" || nm === "STRONG" || laVetStijl(k),
        i: erf.i || nm === "I" || nm === "EM" || laCursiefStijl(k),
        href: nm === "A" ? (k.getAttribute("href") || erf.href) : erf.href
      }, uit);
    }
  }

  function laNormRuns(runs) {
    var uit = [];
    runs.forEach(function (r) {
      if (!r.t) return;
      var l = uit[uit.length - 1];
      if (l && !!l.b === !!r.b && !!l.i === !!r.i && (l.href || "") === (r.href || "")) { l.t += r.t; }
      else { uit.push({ t: r.t, b: !!r.b, i: !!r.i, href: r.href || "" }); }
    });
    return uit;
  }
  function laRunsNaarChars(runs) {
    var uit = [];
    runs.forEach(function (r) {
      for (var i = 0; i < r.t.length; i++) { uit.push({ c: r.t.charAt(i), b: r.b, i: r.i, href: r.href }); }
    });
    return uit;
  }
  function laCharsNaarRuns(chars) {
    return laNormRuns(chars.map(function (c) { return { t: c.c, b: c.b, i: c.i, href: c.href }; }));
  }
  function laBlokTekst(b) {
    return b.runs.map(function (r) { return r.t; }).join("");
  }

  /* Heeft de kaart blokstructuur, of is het één stuk platte tekst met pre-wrap?
     Dat bepaalt niet alleen de weergave maar ook hoe er bewerkt wordt: platte kaarten
     blijven plaintext-only tot de reviewer zelf opmaak aanzet. */
  function laIsRijk(box) { return !!box.querySelector("p,ul,ol,li,div"); }

  function laBlokkenVanTekst(box) {
    var runs = []; laRunsVanNode(box, {}, runs);
    var chars = laRunsNaarChars(laNormRuns(runs));
    var tekst = chars.map(function (c) { return c.c; }).join("");
    var blokken = [], start = 0, re = /\n[ \t]*\n[ \t\n]*/g, m;
    while ((m = re.exec(tekst)) !== null) {
      blokken.push({ soort: "p", runs: laCharsNaarRuns(chars.slice(start, m.index)) });
      start = m.index + m[0].length;
    }
    blokken.push({ soort: "p", runs: laCharsNaarRuns(chars.slice(start)) });
    var gevuld = blokken.filter(function (b) { return laBlokTekst(b) !== ""; });
    return gevuld.length ? gevuld : [{ soort: "p", runs: [] }];
  }

  /* Recursief, want een editor-commando levert geneste structuur op die geen mailclient
     zo bedoeld rendert: Chrome zet een <ul> gerust binnen een <p>, en een subopsomming
     binnen een <li>. Alles wordt hier platgeslagen tot één rij blokken. */
  function laLeesBlokken(node, blokken) {
    var los = [];
    function spoel() {
      var n = laNormRuns(los); los = [];
      if (laBlokTekst({ runs: n }) !== "") { blokken.push({ soort: "p", runs: n }); }
    }
    Array.prototype.forEach.call(node.childNodes, function (k) {
      var nm = k.nodeName;
      if (k.nodeType === 1 && (nm === "UL" || nm === "OL")) {
        spoel();
        var soort = nm === "UL" ? "ul" : "ol";
        Array.prototype.forEach.call(k.children, function (li) {
          if (li.nodeName !== "LI") return;
          var eigen = [], sub = [];
          Array.prototype.forEach.call(li.childNodes, function (kk) {
            if (kk.nodeType === 1 && (kk.nodeName === "UL" || kk.nodeName === "OL")) { sub.push(kk); return; }
            laRunsVanNode({ childNodes: [kk] }, {}, eigen);
          });
          var runs = laNormRuns(eigen);
          if (laBlokTekst({ runs: runs }) !== "") { blokken.push({ soort: soort, runs: runs }); }
          /* Diepere nesting wordt één niveau: mailclients tonen die toch niet
             betrouwbaar, en de projectie kent geen niveaus. */
          sub.forEach(function (x) { laLeesBlokken({ childNodes: [x] }, blokken); });
        });
        return;
      }
      if (k.nodeType === 1 && (nm === "P" || nm === "DIV" || nm === "BLOCKQUOTE")) {
        spoel();
        if (k.querySelector("ul,ol,p,div")) { laLeesBlokken(k, blokken); return; }
        var r = []; laRunsVanNode(k, {}, r);
        var rr = laNormRuns(r);
        if (laBlokTekst({ runs: rr }) !== "") { blokken.push({ soort: "p", runs: rr }); }
        return;
      }
      laRunsVanNode({ childNodes: [k] }, {}, los);
    });
    spoel();
  }

  function laBlokkenVanBox(box) {
    if (!laIsRijk(box)) return laBlokkenVanTekst(box);
    var blokken = [];
    laLeesBlokken(box, blokken);
    return blokken.length ? blokken : [{ soort: "p", runs: [] }];
  }

  /* De platte-tekstprojectie: precies de tekst die in een plain-text mail zou staan.
     Bewust zónder opmaakmarkeringen (geen "- ", geen "**"): die zouden botsen met tekst
     die de reviewer zelf typt, en zouden opmaak als woordwijziging in de tekstdiff duwen.
     Alinea's staan een lege regel uit elkaar, opsommingsregels een enkele. */
  function laProjectie(blokken) {
    var uit = "";
    blokken.forEach(function (b, i) {
      if (i > 0) {
        var vorige = blokken[i - 1];
        uit += (b.soort !== "p" && vorige.soort !== "p") ? "\n" : "\n\n";
      }
      uit += laBlokTekst(b);
    });
    return uit;
  }

  /* Serialisatie naar mail-veilige HTML. Alleen p/ul/ol/li/b/i/a/br: dat is de
     doorsnede die Outlook, Gmail en Teams alle drie zonder eigen interpretatie tonen. */
  function laEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function laRunsNaarHtml(runs) {
    var h = runs.map(function (r) {
      var s = laEsc(r.t).replace(/\n/g, "<br>");
      if (r.b) s = "<b>" + s + "</b>";
      if (r.i) s = "<i>" + s + "</i>";
      if (r.href) s = '<a href="' + laEsc(r.href).replace(/"/g, "&quot;") + '">' + s + "</a>";
      return s;
    }).join("");
    return h || "<br>";
  }
  function laBlokkenNaarHtml(blokken) {
    var uit = "", i = 0;
    while (i < blokken.length) {
      var b = blokken[i];
      if (b.soort === "p") { uit += "<p>" + laRunsNaarHtml(b.runs) + "</p>"; i++; continue; }
      var tag = b.soort === "ul" ? "ul" : "ol";
      uit += "<" + tag + ">";
      while (i < blokken.length && blokken[i].soort === b.soort) {
        uit += "<li>" + laRunsNaarHtml(blokken[i].runs) + "</li>"; i++;
      }
      uit += "</" + tag + ">";
    }
    return uit;
  }

  /* Woord-diff via LCS. Woordniveau, niet teken- of regelniveau: bij lopende tekst
     leest dat als tracked changes in plaats van als ruis. */
  function laDiff(oud, nieuw) {
    var a = laTokens(oud), b = laTokens(nieuw), n = a.length, m = b.length;
    var uit = [];
    function duw(op, t) {
      var l = uit[uit.length - 1];
      if (l && l.op === op) { l.t += t; } else { uit.push({ op: op, t: t }); }
    }
    /* Bij extreem lange teksten is de matrix niet de moeite; dan is "alles vervangen"
       een eerlijker antwoord dan een bevroren tabblad. */
    if (n * m > 400000) {
      if (oud) duw("-", oud);
      if (nieuw) duw("+", nieuw);
      return uit;
    }
    var d = [], i, j;
    for (i = 0; i <= n; i++) { d.push(new Uint32Array(m + 1)); }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
      }
    }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { duw("=", a[i]); i++; j++; }
      else if (d[i + 1][j] >= d[i][j + 1]) { duw("-", a[i]); i++; }
      else { duw("+", b[j]); j++; }
    }
    while (i < n) { duw("-", a[i++]); }
    while (j < m) { duw("+", b[j++]); }
    return uit;
  }

  /* Van een platte lijst wijzigingen naar hunks, zoals een unified diff dat doet.
     Elke aaneengesloten wijziging wordt een eigen blok met de tekst eromheen als anker.
     Waarom context en geen positie: een regel- of tekennummer klopt niet meer zodra er
     iets bóven de wijziging verandert, terwijl de omringende woorden een blok ook in een
     gewijzigd document nog terugvindbaar maken. Dat is precies waarom `patch` een hunk
     met een verschoven nummer alsnog plaatst.

     Het alineanummer is er om naar te kúnnen verwijzen ("alinea 3"), niet om op te
     zoeken. Verwar de twee niet: het anker is de tekst. */
  function laStaart(t, n) {
    if (t.length <= n) return t;
    var deel = t.slice(t.length - n);
    var sp = deel.search(/\S/);
    var w = deel.indexOf(" ");
    return w > 0 && w < 12 ? deel.slice(w + 1) : deel.slice(sp < 0 ? 0 : sp);
  }
  function laKop(t, n) {
    if (t.length <= n) return t;
    var deel = t.slice(0, n);
    var w = deel.lastIndexOf(" ");
    return w > n - 12 && w > 0 ? deel.slice(0, w) : deel;
  }
  function laAlinea(tekst, pos) {
    var voor = tekst.slice(0, Math.max(0, pos));
    return (voor.split(/\n\s*\n/).length);
  }

  function laHunks(ops, nieuweTekst, blokken) {
    var lijst = [], posNieuw = 0;
    ops.forEach(function (o) {
      lijst.push({ op: o.op, t: o.t, nieuw: posNieuw });
      if (o.op !== "-") posNieuw += o.t.length;
    });
    /* Het anker mag niet buiten het eigen blok reiken. In de HTML-bron staat tussen twee
       blokken een tag, dus een anker dat een blokgrens overschrijdt is daar nooit terug
       te vinden — en pas-hunk-toe.py zou het blok dan niet kunnen plaatsen. Binnen het
       blok is de tekst wél letterlijk wat er in de bron staat. */
    var bereiken = blokken ? laBlokBereiken(blokken) : null;
    function blokBij(pos) {
      if (!bereiken) return null;
      for (var k = 0; k < bereiken.length; k++) {
        if (pos >= bereiken[k].start && pos <= bereiken[k].tot) return { b: bereiken[k], i: k };
      }
      return null;
    }
    var hunks = [], i = 0, n = 0;
    while (i < lijst.length) {
      if (lijst[i].op === "=") { i++; continue; }
      var start = i, verwijderd = "", toegevoegd = "";
      while (i < lijst.length && lijst[i].op !== "=") {
        if (lijst[i].op === "-") { verwijderd += lijst[i].t; }
        else { toegevoegd += lijst[i].t; }
        i++;
      }
      n += 1;
      var pos = lijst[start].nieuw;
      var vak = blokBij(pos);
      var maxVoor = vak ? Math.max(0, Math.min(40, pos - vak.b.start)) : 40;
      var naPos = i < lijst.length ? lijst[i].nieuw : pos;
      var maxNa = vak ? Math.max(0, Math.min(40, vak.b.eind - naPos)) : 40;
      hunks.push({
        n: n,
        soort: "tekst",
        alinea: laAlinea(nieuweTekst, pos),
        blok: vak ? laBlokTekst(blokken[vak.i]).slice(0, 80) : "",
        voor: start > 0 ? laStaart(lijst[start - 1].t, maxVoor) : "",
        na: i < lijst.length ? laKop(lijst[i].t, maxNa) : "",
        verwijderd: verwijderd,
        toegevoegd: toegevoegd
      });
    }
    return hunks;
  }

  /* === opmaakkanaal ================================================
     Opmaak zit niet in de projectie, dus verandert er niets aan de tekstdiff wanneer een
     regel een bullet wordt of een woord vet. Die wijzigingen krijgen hun eigen hunks.
     Blokken worden gekoppeld op hun tekst (LCS); een blok waarvan óók de tekst wijzigde
     koppelt niet en zit dus al in de tekst-hunks — de volledige nieuwe versie staat
     hoe dan ook in `nieuwHtml`. */
  function laBlokLcs(oud, nieuw) {
    var a = oud.map(laBlokTekst), b = nieuw.map(laBlokTekst);
    var n = a.length, m = b.length, i, j;
    var d = [];
    for (i = 0; i <= n; i++) { d.push(new Uint32Array(m + 1)); }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
      }
    }
    var paren = [], nieuwGekoppeld = {};
    i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { paren.push([i, j]); nieuwGekoppeld[j] = true; i++; j++; }
      else if (d[i + 1][j] >= d[i][j + 1]) { i++; }
      else { j++; }
    }
    return { paren: paren, nieuwGekoppeld: nieuwGekoppeld };
  }

  var LA_SOORTNAAM = { p: "alinea", ul: "opsomming", ol: "genummerde opsomming" };

  /* Waar in dit blok verschilt een merk? Geeft de tekst waarop het merk aan- of
     uitging, zodat de melding aanwijst wat er vet werd en niet alleen dát er iets vet werd. */
  function laMerkVerschil(oudB, nieuwB, merk) {
    var a = laRunsNaarChars(oudB.runs), b = laRunsNaarChars(nieuwB.runs);
    var aan = "", uit = "", k;
    for (k = 0; k < b.length && k < a.length; k++) {
      var va = merk === "href" ? (a[k].href || "") : !!a[k][merk];
      var vb = merk === "href" ? (b[k].href || "") : !!b[k][merk];
      if (va === vb) continue;
      if (merk === "href") { if (vb) { aan += b[k].c; } else { uit += b[k].c; } }
      else if (vb) { aan += b[k].c; } else { uit += b[k].c; }
    }
    return { aan: aan.trim(), uit: uit.trim() };
  }

  function laOpmaakVanBlok(b) {
    var stukken = [];
    if (b.soort !== "p") { stukken.push(LA_SOORTNAAM[b.soort]); }
    var vet = "", cur = "", link = "";
    b.runs.forEach(function (r) {
      if (r.b) vet += r.t;
      if (r.i) cur += r.t;
      if (r.href && !link) link = r.href;
    });
    if (vet.trim()) stukken.push('vet op "' + vet.trim().slice(0, 40) + '"');
    if (cur.trim()) stukken.push('cursief op "' + cur.trim().slice(0, 40) + '"');
    if (link) stukken.push("link naar " + link);
    return stukken;
  }

  function laOpmaakHunks(oudBlokken, nieuwBlokken, startNr) {
    var koppel = laBlokLcs(oudBlokken, nieuwBlokken);
    var hunks = [], n = startNr;
    koppel.paren.forEach(function (paar) {
      var o = oudBlokken[paar[0]], b = nieuwBlokken[paar[1]];
      var beschrijving = [];
      if (o.soort !== b.soort) {
        beschrijving.push(LA_SOORTNAAM[o.soort] + " werd " + LA_SOORTNAAM[b.soort]);
      }
      ["b", "i", "href"].forEach(function (merk) {
        var v = laMerkVerschil(o, b, merk);
        var naam = merk === "b" ? "vet" : merk === "i" ? "cursief" : "link";
        if (v.aan) beschrijving.push(naam + ' aan op "' + v.aan.slice(0, 40) + '"');
        if (v.uit) beschrijving.push(naam + ' weg op "' + v.uit.slice(0, 40) + '"');
      });
      if (!beschrijving.length) return;
      n += 1;
      hunks.push({
        n: n, soort: "opmaak", blokIndex: paar[1],
        blok: laBlokTekst(b).slice(0, 80),
        van: LA_SOORTNAAM[o.soort], naar: LA_SOORTNAAM[b.soort],
        omschrijving: beschrijving.join(", ")
      });
    });
    /* Een regel die de reviewer nieuw typte én meteen opmaak gaf: de tekst zit in de
       tekst-hunks, maar dat het een bullet is zou anders nergens staan. */
    nieuwBlokken.forEach(function (b, j) {
      if (koppel.nieuwGekoppeld[j]) return;
      var stukken = laOpmaakVanBlok(b);
      if (!stukken.length) return;
      n += 1;
      hunks.push({
        n: n, soort: "opmaak", blokIndex: j, nieuwBlok: true,
        blok: laBlokTekst(b).slice(0, 80),
        van: "", naar: LA_SOORTNAAM[b.soort],
        omschrijving: "nieuwe regel, " + stukken.join(", ")
      });
    });
    return hunks;
  }

  /* === weergave van de tracked changes =============================
     De diff loopt over de projectie; de weergave over de blokken. Elk blok kent zijn
     bereik in de projectie (inclusief de scheiding erna, zodat elk teken bij precies één
     blok hoort), en daarbinnen wordt per stukje bepaald of het ongewijzigd, toegevoegd of
     verwijderd is. Zo blijft de kaart eruitzien als de mail terwijl de wijzigingen
     erin zichtbaar zijn. */
  function laBlokBereiken(blokken) {
    var bereiken = [], pos = 0;
    blokken.forEach(function (b, i) {
      var start = pos, lengte = laBlokTekst(b).length;
      pos += lengte;
      var scheiding = 0;
      if (i < blokken.length - 1) {
        var volgende = blokken[i + 1];
        scheiding = (volgende.soort !== "p" && b.soort !== "p") ? 1 : 2;
        pos += scheiding;
      }
      bereiken.push({ start: start, eind: start + lengte, tot: pos });
    });
    return bereiken;
  }

  /* Ops -> segmenten over de nieuwe tekst (= en +) plus losse verwijderingen die op een
     positie in de nieuwe tekst hangen. Het hunknummer telt precies zoals laHunks telt:
     één nummer per aaneengesloten reeks wijzigingen. */
  function laSegmenten(ops) {
    var seg = [], weg = [], pos = 0, nr = 0, inWijziging = false;
    ops.forEach(function (o) {
      if (o.op === "=") {
        seg.push({ start: pos, eind: pos + o.t.length, op: "=", nr: 0 });
        pos += o.t.length; inWijziging = false; return;
      }
      if (!inWijziging) { nr += 1; inWijziging = true; }
      if (o.op === "+") {
        seg.push({ start: pos, eind: pos + o.t.length, op: "+", nr: nr });
        pos += o.t.length;
      } else {
        weg.push({ pos: pos, t: o.t, nr: nr });
      }
    });
    return { seg: seg, weg: weg };
  }

  function laMaakInline(runs, bereik, segmenten, getoond) {
    /* Geeft een DocumentFragment met de runs van één blok, opgeknipt op de
       segmentgrenzen. `getoond` onthoudt welke hunknummers al een superscript kregen. */
    var frag = document.createDocumentFragment();
    var chars = laRunsNaarChars(runs);
    function nummer(nr) {
      if (!nr || getoond[nr]) return null;
      getoond[nr] = true;
      var sup = document.createElement("sup");
      sup.className = "la-hunk-nr";
      sup.textContent = nr;
      return sup;
    }
    function stuk(vanaf, tot, op, nr) {
      var deel = chars.slice(vanaf, tot);
      if (!deel.length) return;
      var sup = op === "+" ? nummer(nr) : null;
      if (sup) frag.appendChild(sup);
      laCharsNaarRuns(deel).forEach(function (r) {
        var knoop = document.createDocumentFragment();
        r.t.split("\n").forEach(function (regel, idx) {
          if (idx) knoop.appendChild(document.createElement("br"));
          if (regel) knoop.appendChild(document.createTextNode(regel));
        });
        var el = knoop;
        function wikkel(tag) {
          var e = document.createElement(tag); e.appendChild(el); el = e; return e;
        }
        if (r.b) wikkel("b");
        if (r.i) wikkel("i");
        if (r.href) { wikkel("a").setAttribute("href", r.href); }
        if (op === "+") { wikkel("ins"); }
        frag.appendChild(el);
      });
    }
    /* verwijderingen op positie invoegen, gemengd met de segmenten */
    var punten = [];
    segmenten.seg.forEach(function (s) {
      var van = Math.max(s.start, bereik.start), tot = Math.min(s.eind, bereik.eind);
      if (tot > van) punten.push({ soort: "seg", van: van, tot: tot, op: s.op, nr: s.nr });
    });
    segmenten.weg.forEach(function (w) {
      if (w.pos >= bereik.start && w.pos <= bereik.tot && w.pos <= bereik.eind) {
        punten.push({ soort: "weg", van: w.pos, t: w.t, nr: w.nr });
      } else if (w.pos > bereik.eind && w.pos <= bereik.tot) {
        punten.push({ soort: "weg", van: bereik.eind, t: w.t, nr: w.nr });
      }
    });
    punten.sort(function (a, b) {
      if (a.van !== b.van) return a.van - b.van;
      return a.soort === "weg" ? -1 : 1;
    });
    punten.forEach(function (p) {
      if (p.soort === "seg") { stuk(p.van - bereik.start, p.tot - bereik.start, p.op, p.nr); return; }
      var sup = nummer(p.nr);
      if (sup) frag.appendChild(sup);
      var del = document.createElement("del");
      del.textContent = p.t;
      frag.appendChild(del);
    });
    return frag;
  }

  function laTekenBlokken(box, blokken, ops, rijk, opmaakHunks) {
    box.textContent = "";
    var bereiken = laBlokBereiken(blokken);
    var segmenten = laSegmenten(ops);
    var getoond = {};
    var perBlok = {};
    (opmaakHunks || []).forEach(function (h) {
      if (h.blokIndex == null) return;
      (perBlok[h.blokIndex] = perBlok[h.blokIndex] || []).push(h);
    });
    var i = 0, lijst = null, lijstSoort = null;
    function sluitLijst() { lijst = null; lijstSoort = null; }
    while (i < blokken.length) {
      var b = blokken[i], bereik = bereiken[i];
      var inhoud = laMaakInline(b.runs, bereik, segmenten, getoond);
      var opm = perBlok[i];
      if (!rijk) {
        sluitLijst();
        if (i > 0) {
          var vorige = blokken[i - 1];
          box.appendChild(document.createTextNode(
            (b.soort !== "p" && vorige.soort !== "p") ? "\n" : "\n\n"));
        }
        if (opm) {
          var merk = document.createElement("span");
          merk.className = "la-opmaak";
          merk.title = opm.map(function (h) { return h.omschrijving; }).join("; ");
          opm.forEach(function (h) {
            var s = document.createElement("sup");
            s.className = "la-hunk-nr"; s.textContent = h.n;
            merk.appendChild(s);
          });
          merk.appendChild(inhoud);
          box.appendChild(merk);
        } else {
          box.appendChild(inhoud);
        }
        i++; continue;
      }
      var el;
      if (b.soort === "p") {
        sluitLijst();
        el = document.createElement("p");
        box.appendChild(el);
      } else {
        var tag = b.soort === "ul" ? "ul" : "ol";
        if (!lijst || lijstSoort !== b.soort) {
          lijst = document.createElement(tag); lijstSoort = b.soort; box.appendChild(lijst);
        }
        el = document.createElement("li");
        lijst.appendChild(el);
      }
      if (opm) {
        el.className = "la-opmaak";
        el.title = opm.map(function (h) { return h.omschrijving; }).join("; ");
        opm.forEach(function (h) {
          var s = document.createElement("sup");
          s.className = "la-hunk-nr"; s.textContent = h.n;
          el.appendChild(s);
        });
      }
      el.appendChild(inhoud);
      i++;
    }
  }

  /* Naam van het concept, om een bewerking na een reload bij de goede kaart terug te
     vinden. De kop van de kaart is stabieler dan een index: kaarten worden verplaatst. */
  function laVeld(box, index) {
    var kaart = box.closest ? box.closest(".la-draft") : null;
    var kop = kaart && kaart.querySelector(".la-draft-hdr");
    var t = (kop && kop.textContent || "").replace(/\s+/g, " ").trim();
    return t ? t.slice(0, 160) : "concept-" + (index + 1);
  }

  /* === cursorposities =============================================
     Posities worden geteld in tekens van de kale tekst zoals die in de DOM staat: alles
     in een <del> telt niet mee (dat staat er straks niet meer) en het bloknummer is
     opmaak, geen tekst. Blokscheidingen zitten in de rijke weergave niet in de DOM, dus
     dezelfde telling geldt vóór en ná het omschakelen tussen opmaak en kale tekst. */
  function laDomTeller(box, doel, doelOffset) {
    var telling = 0, klaar = false;
    (function loop(node) {
      if (klaar) return;
      if (node.nodeType === 3) {
        if (node === doel) { telling += doelOffset; klaar = true; return; }
        telling += node.nodeValue.length;
        return;
      }
      if (node.nodeType !== 1) return;
      if (node.nodeName === "SUP" && node.className === "la-hunk-nr") {
        if (node.contains(doel)) { klaar = true; }
        return;
      }
      if (node.nodeName === "DEL") {
        /* geklikt ín een doorhaling: die tekst verdwijnt, dus de rand ervan is het
           dichtstbijzijnde punt dat straks nog bestaat */
        if (node.contains(doel)) { klaar = true; }
        return;
      }
      if (node.nodeName === "BR") { telling += 1; return; }
      if (node === doel) {
        /* offset in een element = aantal kinderen ervoor */
        for (var k = 0; k < doelOffset && k < node.childNodes.length; k++) { loop(node.childNodes[k]); }
        klaar = true; return;
      }
      for (var i = 0; i < node.childNodes.length && !klaar; i++) { loop(node.childNodes[i]); }
    })(box);
    return telling;
  }

  function laKlikOffset(box, x, y) {
    var r = null;
    if (document.caretRangeFromPoint) { r = document.caretRangeFromPoint(x, y); }
    else if (document.caretPositionFromPoint) {
      var cp = document.caretPositionFromPoint(x, y);
      if (cp) { r = document.createRange(); r.setStart(cp.offsetNode, cp.offset); }
    }
    if (!r || !box.contains(r.startContainer)) return null;
    return laDomTeller(box, r.startContainer, r.startOffset);
  }

  function laSelectieOffsets(box) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    var r = sel.getRangeAt(0);
    if (!box.contains(r.startContainer) || !box.contains(r.endContainer)) return null;
    return {
      start: laDomTeller(box, r.startContainer, r.startOffset),
      eind: laDomTeller(box, r.endContainer, r.endOffset)
    };
  }

  function laPuntOpOffset(box, n) {
    var rest = n, gevonden = null, rand = null;
    (function loop(node) {
      if (gevonden) return;
      if (node.nodeType === 3) {
        if (rest < node.nodeValue.length) { gevonden = { node: node, offset: rest }; return; }
        if (rest === node.nodeValue.length) {
          /* Precies op de grens van twee blokken. Dat punt hoort bij het begin van het
             volgende, niet bij het eind van het vorige: anders trekt een lijstcommando
             de alinea erboven mee de opsomming in. Onthouden en doorlopen; is er geen
             volgend blok, dan is deze rand alsnog het antwoord. */
          rand = { node: node, offset: rest };
        }
        rest -= node.nodeValue.length; return;
      }
      if (node.nodeType !== 1) return;
      if (node.nodeName === "SUP" && node.className === "la-hunk-nr") return;
      if (node.nodeName === "DEL") return;
      if (node.nodeName === "BR") { if (rest <= 1) { gevonden = { node: node.parentNode, offset: 0 }; return; } rest -= 1; return; }
      for (var i = 0; i < node.childNodes.length && !gevonden; i++) { loop(node.childNodes[i]); }
    })(box);
    return gevonden || rand;
  }

  function laZetCaret(box, start, eind) {
    var a = laPuntOpOffset(box, start);
    if (!a) return;
    var b = eind != null && eind !== start ? laPuntOpOffset(box, eind) : a;
    var r = document.createRange();
    r.setStart(a.node, a.offset);
    if (b) { r.setEnd(b.node, b.offset); } else { r.collapse(true); }
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }

  /* === de kaart ==================================================== */
  function laDraftInit() {
    try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) {}
    var boxen = document.querySelectorAll(".la-draft-txt");
    Array.prototype.forEach.call(boxen, function (box, index) {
      if (box.__laKlaar) return;
      box.__laKlaar = true;
      box.__rijk = laIsRijk(box);
      box.__origBlokken = laBlokkenVanBox(box);
      box.__blokken = box.__origBlokken;
      box.__origineel = laProjectie(box.__origBlokken);
      box.__nieuw = box.__origineel;
      box.__origineelHtml = laBlokkenNaarHtml(box.__origBlokken);
      box.__nieuwHtml = box.__origineelHtml;
      box.__veld = laVeld(box, index);
      if (box.__rijk) box.classList.add("la-rijk");

      /* Altijd bewerkbaar. Een knop om "de bewerkmodus aan te zetten" is een drempel
         voor iets wat de reviewer gewoon wil kunnen doen: klikken waar hij wil en typen.
         Een kaart zonder blokstructuur blijft plaintext-only tot de reviewer zelf opmaak
         aanzet: dan kan Enter geen <div> smokkelen die de projectie stilletjes verandert. */
      box.setAttribute("contenteditable", box.__rijk ? "true" : "plaintext-only");
      box.classList.add("la-bewerkbaar");

      var bar = document.createElement("div");
      bar.className = "la-draft-bar";
      var knoppen = [];
      function maakKnop(label, titel, doe) {
        var b = document.createElement("button");
        b.type = "button";
        b.innerHTML = label;
        b.title = titel;
        b.className = "la-fmt";
        b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
        b.addEventListener("click", function (ev) { ev.preventDefault(); doe(); });
        bar.appendChild(b); knoppen.push(b);
        return b;
      }
      maakKnop("<b>B</b>", "Bold (⌘B)", function () { laOpmaakCmd(box, "bold"); });
      maakKnop("<i>I</i>", "Italic (⌘I)", function () { laOpmaakCmd(box, "italic"); });
      maakKnop("Link", "Link (⌘K)", function () { laLinkCmd(box); });
      maakKnop("• List", "Bulleted list", function () { laOpmaakCmd(box, "insertUnorderedList"); });
      maakKnop("1. List", "Numbered list", function () { laOpmaakCmd(box, "insertOrderedList"); });
      var scheiding = document.createElement("span");
      scheiding.className = "la-draft-scheiding";
      bar.appendChild(scheiding);
      var bDiff = document.createElement("button");
      bDiff.type = "button";
      bDiff.className = "la-draft-diff";
      bDiff.textContent = "Show changes";
      bDiff.style.display = "none";
      var bHerstel = document.createElement("button");
      bHerstel.type = "button";
      bHerstel.textContent = "↺ Restore original";
      bHerstel.style.display = "none";
      var meld = document.createElement("span");
      meld.className = "la-draft-meld";
      meld.textContent = "click the text to edit";
      bar.appendChild(bDiff); bar.appendChild(bHerstel); bar.appendChild(meld);
      box.parentNode.insertBefore(bar, box.nextSibling);
      box.__bar = { diff: bDiff, herstel: bHerstel, meld: meld, fmt: knoppen };

      function laBerekenWijziging() {
        var ops = laDiff(box.__origineel, box.__nieuw);
        var tekstGewijzigd = ops.some(function (o) { return o.op !== "="; });
        var opmaak = laOpmaakHunks(box.__origBlokken, box.__blokken,
          tekstGewijzigd ? laHunks(ops, box.__nieuw, box.__blokken).length : 0);
        return { ops: ops, opmaak: opmaak, gewijzigd: tekstGewijzigd || opmaak.length > 0 };
      }

      /* Status in de bar: knoppen en melding volgen of er iets gewijzigd is, los van
         de vraag of de doorhalingen nu getoond worden. */
      function toonStatus(gewijzigd) {
        bDiff.style.display = gewijzigd ? "" : "none";
        bDiff.textContent = box.__markup ? "Hide changes" : "Show changes";
        bDiff.classList.toggle("la-actief", !!box.__markup);
        bHerstel.style.display = gewijzigd ? "" : "none";
        meld.textContent = gewijzigd
          ? (box.__nr ? "saved as annotation " + box.__nr : "edit not saved yet")
          : "click the text to edit";
      }

      /* De opgemaakte weergave (doorhaling + onderstreping) komt alleen op verzoek, via
         de knop "Show changes". Niet automatisch bij het eruit klikken: dat springt in
         het gezicht van iemand die gewoon aan het herschrijven is. En alleen als de
         cursor er niet in staat, anders zou hij in zijn eigen doorhalingen zitten typen. */
      function toonMarkup() {
        if (box.__actief) return null;
        var w = laBerekenWijziging();
        if (w.gewijzigd) {
          laTekenBlokken(box, box.__blokken, w.ops, box.__rijk, w.opmaak);
          box.__markup = true;
        } else {
          laToonKaal(box);
          box.__markup = false;
        }
        toonStatus(w.gewijzigd);
        return w.ops;
      }
      box.__toonMarkup = toonMarkup;

      function toonPlat() {
        if (!box.__markup) return;
        laToonKaal(box);
        box.__markup = false;
        toonStatus(laBerekenWijziging().gewijzigd);
      }
      box.__toonPlat = toonPlat;

      /* Kale kaart, maar wel de status bijwerken: dit is wat er na blur en na reload
         gebeurt in plaats van de automatische diff. */
      function toonKaalMetStatus() {
        laToonKaal(box);
        box.__markup = false;
        toonStatus(laBerekenWijziging().gewijzigd);
      }
      box.__toonKaalMetStatus = toonKaalMetStatus;

      bDiff.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      bDiff.addEventListener("click", function (ev) {
        ev.preventDefault();
        if (box.__markup) { toonPlat(); return; }
        if (box.__actief) { box.blur(); }
        box.__actief = false;
        toonMarkup();
      });

      /* Klikken terwijl de opmaak zichtbaar is, is het lastige geval. De doorgehaalde
         tekst verdwijnt bij het terugschakelen naar kale tekst, dus de regel loopt anders
         en de cursor van de browser landt op de verkeerde plek. Daarom rekenen we de
         klikpositie zelf om: waar zat die klik in de kale tekst, de doorhalingen niet
         meegeteld — en dáár zetten we de cursor terug. */
      box.addEventListener("mousedown", function (ev) {
        if (!box.__markup) return;
        var doel = laKlikOffset(box, ev.clientX, ev.clientY);
        ev.preventDefault();
        box.__actief = true;
        toonPlat();
        box.focus();
        if (doel !== null) { laZetCaret(box, doel); }
      });
      box.addEventListener("focus", function () { box.__actief = true; toonPlat(); });

      /* Plakken gaat altijd als platte tekst: zo komt er geen vreemde opmaak de kaart in
         die straks niet door een mailclient te renderen is. */
      box.addEventListener("paste", function (ev) {
        var t = ev.clipboardData && ev.clipboardData.getData("text/plain");
        if (t == null) return;
        ev.preventDefault();
        try { document.execCommand("insertText", false, t); } catch (e) {}
      });

      function bewaarNu() {
        box.__blokken = laBlokkenVanBox(box);
        box.__nieuw = laProjectie(box.__blokken);
        box.__nieuwHtml = laBlokkenNaarHtml(box.__blokken);
        var ops = laDiff(box.__origineel, box.__nieuw);
        var tekstGewijzigd = ops.some(function (o) { return o.op !== "="; });
        var opmaak = laOpmaakHunks(box.__origBlokken, box.__blokken,
          tekstGewijzigd ? laHunks(ops, box.__nieuw, box.__blokken).length : 0);
        if (tekstGewijzigd || opmaak.length) { laBewaarBewerking(box, ops, opmaak); }
        else if (box.__annId) { laVerwijderBewerking(box); }
        return ops;
      }
      box.__bewaarNu = bewaarNu;

      /* Tijdens het typen alleen opslaan, niet opmaken: de cursor mag niet verspringen. */
      var timer = null;
      box.addEventListener("input", function () {
        clearTimeout(timer);
        meld.textContent = "typing…";
        timer = setTimeout(function () { bewaarNu(); meld.textContent =
          box.__nr ? "saved as annotation " + box.__nr : "saved"; }, 900);
      });

      box.addEventListener("blur", function () {
        clearTimeout(timer);
        box.__actief = false;
        bewaarNu();
        toonKaalMetStatus();
      });

      box.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") { ev.preventDefault(); box.blur(); return; }
        if (!(ev.metaKey || ev.ctrlKey)) return;
        var k = ev.key.toLowerCase();
        if (k === "b") { ev.preventDefault(); laOpmaakCmd(box, "bold"); }
        else if (k === "i") { ev.preventDefault(); laOpmaakCmd(box, "italic"); }
        else if (k === "k") { ev.preventDefault(); laLinkCmd(box); }
      });

      bHerstel.addEventListener("click", function () {
        box.__blokken = box.__origBlokken;
        box.__nieuw = box.__origineel;
        box.__nieuwHtml = box.__origineelHtml;
        box.__markup = false;
        laToonKaal(box);
        laVerwijderBewerking(box);
        bDiff.style.display = "none";
        bHerstel.style.display = "none";
        meld.textContent = "original restored";
      });
    });
  }

  /* De kale kaart: platte tekst zolang de agent hem plat schreef, blokken zodra er
     structuur in zit. Twee weergaven, één model. */
  function laToonKaal(box) {
    if (box.__rijk) { box.innerHTML = laBlokkenNaarHtml(box.__blokken); }
    else { box.textContent = box.__nieuw; }
  }

  /* Opmaak aanzetten op een kaart die nog platte tekst is, betekent eerst omschakelen
     naar blokken. Dat kan niet halverwege: pre-wrap uitzetten terwijl de rest nog uit
     kale regelovergangen bestaat zou al die regels op één hoop gooien. Dus in één keer,
     met de selectie op zijn plek terug. */
  function laMaakRijk(box) {
    if (box.__rijk) return;
    var sel = laSelectieOffsets(box);
    box.__blokken = laBlokkenVanBox(box);
    box.__rijk = true;
    box.classList.add("la-rijk");
    box.setAttribute("contenteditable", "true");
    box.innerHTML = laBlokkenNaarHtml(box.__blokken);
    box.focus();
    /* De scheidingen tussen blokken zijn in de platte kaart echte tekens en in de rijke
       kaart alleen structuur. Een offset uit de ene telling wijst in de andere dus naar
       een ander teken; daarom eerst omrekenen, anders springt de selectie. */
    if (sel) {
      laZetCaret(box, laProjNaarDom(box.__blokken, sel.start),
        laProjNaarDom(box.__blokken, sel.eind));
    }
  }

  function laProjNaarDom(blokken, n) {
    var bereiken = laBlokBereiken(blokken), voor = 0;
    for (var i = 0; i < bereiken.length; i++) {
      var b = bereiken[i];
      if (n <= b.eind) { return voor + Math.max(0, n - b.start); }
      voor += b.eind - b.start;
    }
    return voor;
  }

  function laOpmaakCmd(box, cmd) {
    if (box.__markup) { box.__actief = true; box.__toonPlat(); box.focus(); }
    laMaakRijk(box);
    box.focus();
    try { document.execCommand(cmd, false, null); } catch (e) {}
    laNormaliseer(box);
    box.__bewaarNu();
  }

  /* Een editor-commando laat de DOM achter zoals de browser hem toevallig bouwt: een
     <ul> in een <p>, een <span style="font-weight:700">, een lege <div>. Direct daarna
     terugschrijven vanuit het model maakt er weer de kleine, mail-veilige vorm van —
     dat is meteen de sanitizer. De tekstinhoud verandert daar niet van, dus de cursor
     kan op dezelfde tekenpositie terug. */
  function laNormaliseer(box) {
    if (!box.__rijk) return;
    var sel = laSelectieOffsets(box);
    box.__blokken = laBlokkenVanBox(box);
    box.innerHTML = laBlokkenNaarHtml(box.__blokken);
    if (sel) { box.focus(); laZetCaret(box, sel.start, sel.eind); }
  }

  function laLinkCmd(box) {
    if (box.__markup) { box.__actief = true; box.__toonPlat(); box.focus(); }
    laMaakRijk(box);
    box.focus();
    var sel = window.getSelection();
    var leeg = !sel || sel.isCollapsed;
    var huidig = "";
    try {
      var n = sel && sel.anchorNode;
      var a = n && (n.nodeType === 1 ? n : n.parentNode);
      a = a && a.closest && a.closest("a");
      if (a) huidig = a.getAttribute("href") || "";
    } catch (e) {}
    var url = prompt(leeg && !huidig ? "Select the text first, then add a link.\nURL:" : "URL:", huidig || "https://");
    if (url === null) return;
    try {
      if (!url) { document.execCommand("unlink", false, null); }
      else { document.execCommand("createLink", false, url); }
    } catch (e) {}
    laNormaliseer(box);
    box.__bewaarNu();
  }

  function laVerwijderBewerking(box) {
    if (!box.__annId) return;
    var a = anns.filter(function (x) { return x.id === box.__annId; })[0];
    if (a) { verwijder(a); }
    box.__annId = null; box.__nr = null;
  }

  function laBewaarBewerking(box, ops, opmaak) {
    var tekstHunks = ops.some(function (o) { return o.op !== "="; }) ? laHunks(ops, box.__nieuw, box.__blokken) : [];
    var a = {
      id: box.__annId || ("edit-" + Date.now() + "-" + Math.random().toString(16).slice(2, 6)),
      type: "edit",
      veld: box.__veld,
      target: box.__veld,
      origineel: box.__origineel,
      nieuw: box.__nieuw,
      origineelHtml: box.__origineelHtml,
      nieuwHtml: box.__nieuwHtml,
      rijk: !!box.__rijk,
      diff: ops,
      hunks: tekstHunks.concat(opmaak || []),
      comment: "Tekst herschreven in het concept",
      rect: { x: 0, y: 0, w: 0, h: 0 }
    };
    var bestaand = box.__annId && anns.filter(function (x) { return x.id === box.__annId; })[0];
    if (bestaand) {
      Object.keys(a).forEach(function (k) { bestaand[k] = a[k]; });
      a = bestaand;
    } else {
      teller += 1; a.nr = teller; a.createdAt = new Date().toISOString();
      anns.push(a);
    }
    box.__annId = a.id;
    return bewaarAnnotatie(a).then(function () {
      box.__nr = a.nr;
      box.__bar.meld.textContent = "saved as annotation " + a.nr;
      return a;
    }).catch(function () {
      box.__bar.meld.textContent = "not saved — bridge unreachable";
    });
  }

  /* Een blok terugplaatsen in de huidige tekst, op zijn anker. Dezelfde drie pogingen
     van streng naar soepel als pas-hunk-toe.py: volledige context, linkercontext, kaal —
     en alleen als de treffer uniek is, want anders zou hij op de verkeerde plek landen. */
  function laPlaatsHunk(tekst, h) {
    var voor = h.voor || "", na = h.na || "";
    var weg = h.verwijderd || "", erbij = h.toegevoegd || "";
    var pogingen = [[voor + weg + na, voor + erbij + na], [voor + weg, voor + erbij]];
    if (weg) { pogingen.push([weg, erbij]); }
    for (var i = 0; i < pogingen.length; i++) {
      var zoek = pogingen[i][0], vervang = pogingen[i][1];
      if (!zoek) continue;
      var eerste = tekst.indexOf(zoek);
      if (eerste >= 0 && tekst.indexOf(zoek, eerste + 1) < 0) {
        return tekst.slice(0, eerste) + vervang + tekst.slice(eerste + zoek.length);
      }
    }
    return null;
  }

  /* Blokken uit een projectie terugbouwen, zodat een herplaatste tekst weer een model is.
     Alinea's staan een lege regel uit elkaar; opsommingsstructuur komt daarna terug uit
     de opmaak-hunks, die hun blok op de tekst terugvinden. */
  function laBlokkenVanProjectie(tekst) {
    return tekst.split(/\n[ \t]*\n[ \t\n]*/).map(function (deel) {
      return { soort: "p", runs: deel ? [{ t: deel, b: false, i: false, href: "" }] : [] };
    });
  }

  /* Een blok uit de projectie terugbouwen kent geen opsommingen: twee regels die samen
     een lijst waren staan er als één alinea met een harde regelovergang. Het opmaakblok
     wijst zijn regel aan; die wordt er zo nodig uitgesplitst voor hij zijn vorm terugkrijgt. */
  function laPasOpmaakHunkToe(blokken, h) {
    var doel = (h.blok || "").trim();
    if (!doel) return false;
    var soort = h.naar === "opsomming" ? "ul" : h.naar === "genummerde opsomming" ? "ol" : "p";
    for (var i = 0; i < blokken.length; i++) {
      var t = laBlokTekst(blokken[i]);
      if (t.trim() === doel) { blokken[i].soort = soort; return true; }
      var regels = t.split("\n");
      if (regels.length < 2) continue;
      var r = -1;
      for (var k = 0; k < regels.length; k++) { if (regels[k].trim() === doel) { r = k; break; } }
      if (r < 0) continue;
      var vervanging = regels.map(function (regel, k) {
        return {
          soort: k === r ? soort : blokken[i].soort,
          runs: regel ? [{ t: regel, b: false, i: false, href: "" }] : []
        };
      });
      blokken.splice.apply(blokken, [i, 1].concat(vervanging));
      return true;
    }
    return false;
  }

  /* Na een reload staan de bewerkingen op schijf maar toont de kaart weer de tekst zoals
     hij nu is. Is de concepttekst onveranderd, dan komt de bewerkte versie er compleet
     terug — inclusief opmaak. Is de tekst wél gewijzigd, dan worden openstaande blokken
     er één voor één op teruggeplaatst, niet de opgeslagen eindtekst in één keer. Dat
     verschil telt zodra een agent één blok heeft doorgevoerd: de pagina is dan veranderd,
     en alleen wat nog openstaat hoort nog te worden getoond. */
  function laHerstelBewerkingen() {
    var perVeld = {};
    anns.forEach(function (a) { if (a.type === "edit" && a.veld) { perVeld[a.veld] = a; } });
    Array.prototype.forEach.call(document.querySelectorAll(".la-draft-txt"), function (box) {
      var a = perVeld[box.__veld];
      if (!a || !box.__toonKaalMetStatus) return;
      var alle = a.hunks || [];
      var open = alle.filter(function (h) { return !h.resolved; });
      var tekstHunks = open.filter(function (h) { return h.soort !== "opmaak"; });
      var opmaakHunks = open.filter(function (h) { return h.soort === "opmaak"; });

      /* Onveranderd concept: de bewerkte versie compleet terug, opmaak incluis. */
      if (a.origineel === box.__origineel && open.length === alle.length && a.nieuwHtml) {
        var houder = document.createElement("div");
        houder.innerHTML = a.nieuwHtml;
        box.__annId = a.id; box.__nr = a.nr;
        box.__blokken = laBlokkenVanBox(houder);
        box.__nieuw = laProjectie(box.__blokken);
        box.__nieuwHtml = a.nieuwHtml;
        if (a.rijk && !box.__rijk) {
          box.__rijk = true;
          box.classList.add("la-rijk");
          box.setAttribute("contenteditable", "true");
        }
        box.__toonKaalMetStatus();
        return;
      }

      if (!alle.length) {
        /* Oudere bewerking zonder blokken: alleen terugzetten als de tekst nog exact
           is zoals hij was, anders zou de oude versie over de nieuwe heen komen. */
        if (a.origineel && a.origineel !== box.__origineel) {
          box.__bar.meld.textContent = "note: draft text changed since annotation " + a.nr;
          return;
        }
        box.__annId = a.id; box.__nr = a.nr; box.__nieuw = a.nieuw || box.__origineel;
        box.__blokken = laBlokkenVanProjectie(box.__nieuw);
        box.__toonKaalMetStatus();
        return;
      }

      var tekst = box.__origineel, geplaatst = 0, kwijt = [];
      tekstHunks.forEach(function (h) {
        var r = laPlaatsHunk(tekst, h);
        if (r === null) { kwijt.push(h.n); } else { tekst = r; geplaatst += 1; }
      });
      if (tekstHunks.length && !geplaatst) {
        box.__bar.meld.textContent =
          "annotation " + a.nr + ": text changed too much to show the edit";
        return;
      }
      var blokken = laBlokkenVanProjectie(tekst);
      opmaakHunks.forEach(function (h) {
        if (laPasOpmaakHunkToe(blokken, h)) { geplaatst += 1; } else { kwijt.push(h.n); }
      });
      if (!geplaatst) {
        box.__bar.meld.textContent =
          "annotation " + a.nr + ": text changed too much to show the edit";
        return;
      }
      box.__annId = a.id; box.__nr = a.nr;
      box.__nieuw = tekst;
      box.__blokken = blokken;
      box.__nieuwHtml = laBlokkenNaarHtml(blokken);
      if (blokken.some(function (b) { return b.soort !== "p"; }) && !box.__rijk) {
        box.__rijk = true;
        box.classList.add("la-rijk");
        box.setAttribute("contenteditable", "true");
      }
      box.__toonKaalMetStatus();
      if (kwijt.length) {
        box.__bar.meld.textContent = "annotation " + a.nr + ": hunk " + kwijt.join(", ") +
          " no longer found in the text";
      }
    });
  }

  /* ---- test/debug-API -------------------------------------------- */
  window.HtmlAnnotator = {
    anns: function () { return anns; },
    bridge: function () { return brug; },
    session: verversSessie,
    save: bewaarAnnotatie,
    remove: verwijder,
    resolve: markeerVerwerkt,
    /* Alleen case-08; geen publieke API. */
    _test: {
      zoekAnker: zoekAnker,
      locatorVanRange: laLocatorVanRange,
      laTekstNogDaar: laTekstNogDaar,
      laRangeVanLocator: laRangeVanLocator,
      laRectsVanRange: laRectsVanRange,
      bridgeOrigin: BRIDGE,
    },
    drafts: function () {
      return Array.prototype.map.call(document.querySelectorAll(".la-draft-txt"), function (b) {
        return { veld: b.__veld, origineel: b.__origineel, nieuw: b.__nieuw,
          origineelHtml: b.__origineelHtml, nieuwHtml: b.__nieuwHtml,
          rijk: !!b.__rijk, blokken: b.__blokken, nr: b.__nr || null };
      });
    },
    diff: laDiff,
    draftModel: { blokken: laBlokkenVanBox, projectie: laProjectie, html: laBlokkenNaarHtml,
      opmaakHunks: laOpmaakHunks, hunks: laHunks },
    /* Hergebruik van de volledige popup (chips, plakken, Cmd+Enter) door
       andere componenten, zoals LA-SUGGEST. onSave krijgt {comment, refs}. */
    openComposer: function (opts) {
      openPopup({ type: "text", selectedText: opts.quote || "",
        comment: opts.comment || "", refs: opts.refs || null,
        rect: opts.rect || null, _composer: opts });
    },
    add: function (a) {
      teller += 1;
      a.nr = teller; a.type = a.type || (a.selectedText ? "text" : "region");
      a.id = a.id || Date.now() + "-" + teller;
      a.createdAt = a.createdAt || new Date().toISOString();
      if (!a.rect) a.rect = { x: 0, y: 0, w: 0, h: 0 };
      return bewaarAnnotatie(a);
    }
  };
  /* Deprecated alias for pages embedded before the rename; kept until 1.1. */
  window.LucAnnotator = window.HtmlAnnotator;
  /* ---- knoppen naar een nieuwe Claude-sessie ---------------------- */
  /* Een ingebedde browser (zoals de preview-pane) geeft custom schemes als
     claude:// niet door aan het OS: de klik doet dan stilzwijgend niets.
     We proberen te navigeren en merken aan het uitblijven van een blur dat het
     mislukt is; dan kopiëren we de link, zodat de reviewer hem kan plakken. */
  function meldSessie(tekst, fout) {
    var m = document.getElementById("la-sesmeld") || el("div");
    m.id = "la-sesmeld";
    m.className = fout ? "la-sesmeld la-fout" : "la-sesmeld";
    m.textContent = tekst;
    clearTimeout(m._t);
    m._t = setTimeout(function () { if (m.parentNode) m.remove(); }, 7000);
  }
  function naarKlembord(url) {
    var klaar = function () {
      meldSessie("This view cannot open Claude links. The link is on your clipboard — paste it in Spotlight (⌘Space).", true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(klaar, function () {
        meldSessie("Could not open the session. Start the bridge, or open this page in your own browser.", true);
      });
      return;
    }
    var t = document.createElement("textarea");
    t.value = url; t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); klaar(); } catch (e) {
      meldSessie("Could not open the session. Start the bridge, or open this page in your own browser.", true);
    }
    t.remove();
  }

  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a.la-sessie");
    if (!a) return;
    ev.preventDefault();
    var url = a.getAttribute("href") || "";
    /* Eerst de bridge: die draait buiten de browser en kan het scheme wel
       openen. Lukt dat niet, dan pas navigeren en anders het klembord. */
    post("/sessie", { url: url }).then(function () {
      meldSessie("Opened a new Claude session.");
    }).catch(function () {
      var vertrokken = false;
      function weg() { vertrokken = true; }
      window.addEventListener("blur", weg, { once: true });
      document.addEventListener("visibilitychange", weg, { once: true });
      try { window.location.href = url; } catch (e) { /* geblokkeerd */ }
      setTimeout(function () {
        window.removeEventListener("blur", weg);
        if (!vertrokken) naarKlembord(url);
      }, 700);
    });
  }, true);

  render();
  laDraftInit();
  verversSessie().then(function () { laHerstelBewerkingen(); });
  /* De bridge komt vaak later omhoog dan de pagina: de hook start hem pas ná de
     schrijf-actie, en soms start iemand hem met de hand. Zonder deze poller blijft een
     al openstaande pagina tot een reload op "bridge uit" staan, ook als de bridge
     inmiddels antwoordt. Eén boolean-check per 3 seconden, alleen bij een zichtbare
     pagina; zodra de bridge er is doet hij niets meer, en valt hij later weg dan pakt
     dezelfde timer het weer op. */
  setInterval(function () {
    if (!brug.ok && !document.hidden) verversSessie();
  }, 3000);
  document.addEventListener("visibilitychange", function () {
    if (!brug.ok && !document.hidden) verversSessie();
  });
  window.addEventListener("focus", function () {
    if (!brug.ok) verversSessie();
  });
})();
</script>
